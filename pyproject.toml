[build-system]
# >=77.0.3: version minima con soporte real para "license" como expresion
# SPDX y "license-files" (PEP 639) - verificado que 68.0 falla al instalar
# con este pyproject.toml si alguna vez se instala sin aislamiento de build.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "encuesta-hogares-agente"
version = "0.15.3"
description = "Agente y paquete reutilizable para analizar la Encuesta Continua de Hogares (ECH, INE Uruguay) — brecha digital, hogares, territorio, vivienda, seguridad alimentaria, empleo y seguridad/victimizacion — para cualquier año de datos disponible."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
# >=3.10 y no >=3.9: el código usa uniones `X | Y` en firmas evaluadas al
# importar (ej. analysis.combinar_por_anio), que en 3.9 rompen el import.
# Declarar 3.9 era prometer algo que el paquete no cumplía.
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyreadstat>=1.2",
    "plotly>=5.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "kaleido>=0.2",
    "playwright>=1.40",
    "nbformat>=5.0",
    # El paso 5 del agente ejecuta el notebook con `jupyter nbconvert
    # --execute`, asi que jupyter hace falta para una corrida normal - no
    # es una dependencia de desarrollo. Estaba declarada en [dev] y
    # funcionaba de casualidad porque instalar.bat instala ".[dev]";
    # cualquiera que instalara solo el paquete base quedaba con un
    # proyecto que no puede generar un informe.
    "jupyter",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# E/F/W: errores reales (imports sin usar, nombres indefinidos, variables
# sin usar, comparaciones == True/False, etc.) - no se suma nada de
# estilo/formato mas estricto (ej. import sorting) para no generar un
# diff enorme sobre codigo que ya funciona y esta testeado. E501 (linea
# larga) queda afuera a proposito: el proyecto ya usa lineas largas e
# informativas por diseño (docstrings con citas, tuplas del catalogo).
select = ["E", "F", "W"]
ignore = ["E501"]
